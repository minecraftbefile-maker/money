name: Automated YouTube Shorts Pipeline

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth-oauthlib python-dotenv imageio-ffmpeg edge-tts

      - name: Run main script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BACKGROUND_VIDEO_URL: ${{ secrets.BACKGROUND_VIDEO_URL }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          # Reconstruct client_secrets.json and token.json from secrets if present
          if [ -n "$CLIENT_SECRETS_JSON" ]; then
            echo "$CLIENT_SECRETS_JSON" > client_secrets.json
          fi
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
          fi

          python3 main.py
